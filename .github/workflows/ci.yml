
name: FinCore Secure CI/CD

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------------- BACKEND ----------------
  backend:
    name: Backend Tests and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Run tests
        working-directory: apps/api
        run: npm test

      - name: Type check
        working-directory: apps/api
        run: npm run typecheck

      - name: Build backend
        working-directory: apps/api
        run: npm run build


  # ---------------- FRONTEND ----------------
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build frontend
        working-directory: apps/web
        run: npm run build


  # ---------------- ANALYTICS ----------------
  analytics:
    name: Analytics Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/analytics
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        working-directory: services/analytics
        run: python -m pytest -v


  # ---------------- SECURITY ----------------
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Secret scanning
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2

      # Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Backend dependency audit
      - name: Backend dependency audit
        working-directory: apps/api
        run: |
          npm ci
          npm audit --audit-level=high

      # Frontend dependency audit
      - name: Frontend dependency audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high

      # Filesystem scan
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"


  # ---------------- DOCKER ----------------
  docker:
    name: Docker Build and Image Scan
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build API image
      - name: Build API image
        run: docker build -t fincore-api:ci ./apps/api

      # Build Web image
      - name: Build Web image
        run: docker build -t fincore-web:ci ./apps/web

      # Build Analytics image
      - name: Build Analytics image
        run: docker build -t fincore-analytics:ci ./services/analytics


      # -------- API IMAGE SCAN --------

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-api:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: API Critical vulnerability gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-api:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true


      # -------- WEB IMAGE SCAN --------

      - name: Scan Web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-web:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Web Critical vulnerability gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-web:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true


      # -------- ANALYTICS IMAGE SCAN --------

      - name: Scan Analytics image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-analytics:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Analytics Critical vulnerability gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-analytics:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
