
name: FinCore CI Pipeline

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Run tests
        working-directory: apps/api
        run: npm test

      - name: Type check
        working-directory: apps/api
        run: npm run typecheck

      - name: Build backend
        working-directory: apps/api
        run: npm run build

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build

  analytics:
    name: Analytics Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/analytics
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run tests
        working-directory: services/analytics
        env:
          PYTHONPATH: ${{ github.workspace }}/services/analytics
        run: python -m pytest -v

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret Scan with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --verbose --redact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dependency Audit - API
        working-directory: apps/api
        run: npm audit --audit-level=high

      - name: Dependency Audit - Web
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  docker:
    name: Docker Build and Image Scan
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t fincore-api:ci ./apps/api

      - name: Build Web image
        run: docker build -t fincore-web:ci ./apps/web

      - name: Build Analytics image
        run: docker build -t fincore-analytics:ci ./services/analytics

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-api:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Scan Web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-web:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Scan Analytics image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fincore-analytics:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
